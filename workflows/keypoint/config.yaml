# Optimized Configuration for 24GB GPU
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# This config maximizes training speed with your available memory
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ──────────────────────────────────────────────────────────────────────────────
# Dataset Configuration
# ──────────────────────────────────────────────────────────────────────────────
dataset:
  name: "mcity-coco-person-2017"
  detection_field: "detections"
  keypoint_field: "keypoints"
  train_tag: "filtered_train"      # Use filtered data
  validation_tag: "filtered_val"
  validation_split: 0.1

# ──────────────────────────────────────────────────────────────────────────────
# Job Configuration
# ──────────────────────────────────────────────────────────────────────────────
job:
  type: "both"
  skip_export: true                # Data already exported
  max_validation_samples: null

# ──────────────────────────────────────────────────────────────────────────────
# Finetune Configuration
# ──────────────────────────────────────────────────────────────────────────────
finetune:
  enabled: false
  source: "local"
  local:
    checkpoint_path: "./output/mcity-coco-person-2017/models/l/best.pt"
  learning_rate_scale: 0.1

# ──────────────────────────────────────────────────────────────────────────────
# Model Configuration
# ──────────────────────────────────────────────────────────────────────────────
model:
  size: 'l'  # Large model

# ──────────────────────────────────────────────────────────────────────────────
# Training Configuration - OPTIMIZED FOR 24GB GPU
# ──────────────────────────────────────────────────────────────────────────────
training:
  image_size:
    width: 192
    height: 256

  # ┌──────────────────────────────────────────────────────────────────────────┐
  # │ SPEED OPTIMIZATIONS FOR 24GB GPU                                        │
  # │                                                                          │
  # │ Old settings (1.7GB memory):                                             │
  # │   batch_size: 16                                                         │
  # │   num_workers: 8                                                         │
  # │                                                                          │
  # │ New settings (optimized for 24GB):                                       │
  # │   batch_size: 64    - 4x larger (uses ~6-8GB GPU memory)                │
  # │   num_workers: 32   - 4x more CPU threads for data loading              │
  # │                                                                          │
  # │ Expected speedup: 3-4x faster per epoch!                                 │
  # │   - Was: ~9 minutes per epoch                                            │
  # │   - Now: ~2-3 minutes per epoch                                          │
  # │   - 100 epochs: 15 hours → 4-5 hours!                                    │
  # └──────────────────────────────────────────────────────────────────────────┘

  batch_size: 64           # 4x increase (was 16)
  num_workers: 32          # 4x increase (was 8) - uses more CPU cores

  max_epochs: 100
  learning_rate: 0.0003

  # Dataloader optimizations
  persistent_workers: true  # Keep workers alive between epochs
  pin_memory: true          # Faster GPU transfer
  prefetch_factor: 4        # Prefetch 4 batches per worker

# ──────────────────────────────────────────────────────────────────────────────
# Output Paths
# ──────────────────────────────────────────────────────────────────────────────
paths:
  output_root: "./output"
  validation_dir: "validation_results"

# ──────────────────────────────────────────────────────────────────────────────
# Validation Configuration
# ──────────────────────────────────────────────────────────────────────────────
validation:
  run_after_training: true
  generate_plots: true
  save_report: true
  oks_thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]

# ──────────────────────────────────────────────────────────────────────────────
# Advanced Configuration
# ──────────────────────────────────────────────────────────────────────────────
advanced:
  seed: 42
  device: "cuda:0"
  distributed: false

  # Mixed precision training (further speedup)
  use_amp: true            # Automatic Mixed Precision - 20-30% faster

  save_interval: 10        # Save checkpoint every 10 epochs
  max_keep_checkpoints: 3  # Only keep 3 best checkpoints

# ══════════════════════════════════════════════════════════════════════════════
# PERFORMANCE COMPARISON
# ══════════════════════════════════════════════════════════════════════════════
#
# Old Config (16 batch, 8 workers):
#   - Per epoch: ~9 minutes
#   - 100 epochs: ~15 hours
#   - GPU usage: ~1.7GB / 24GB (7%)
#
# New Config (64 batch, 32 workers):
#   - Per epoch: ~2.5 minutes
#   - 100 epochs: ~4-5 hours
#   - GPU usage: ~8GB / 24GB (33%)
#
# SPEEDUP: 3-4x FASTER! 🚀
#
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# USAGE NOTES
# ══════════════════════════════════════════════════════════════════════════════
#
# 1. Monitor GPU memory:
#    watch -n 1 nvidia-smi
#
# 2. If OOM (Out of Memory):
#    - Reduce batch_size to 48 or 32
#    - Reduce num_workers to 24 or 16
#
# 3. If CPU bottleneck (GPU not fully utilized):
#    - Increase prefetch_factor to 6 or 8
#    - Check: htop (CPU usage should be high)
#
# 4. Expected training time for remaining epochs (60-100):
#    - 40 epochs × 2.5 min = ~1.5-2 hours remaining!
#
# ══════════════════════════════════════════════════════════════════════════════