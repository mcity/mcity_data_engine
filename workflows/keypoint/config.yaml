# Configuration for Lower Body Pose Estimation (keypoint_mmpose.py)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ──────────────────────────────────────────────────────────────────────────────
# Dataset Configuration
# ──────────────────────────────────────────────────────────────────────────────
dataset:
  name: "mcity-coco-person-2017"
  detection_field: "detections"
  keypoint_field: "keypoints"
  train_tag: "train"
  validation_tag: "val"
  validation_split: 0.1

# ──────────────────────────────────────────────────────────────────────────────
# Job Configuration
# ──────────────────────────────────────────────────────────────────────────────
job:
  type: "both"              # Options: "train", "inference", "both"
  skip_export: true         # Set true if data already exported
  max_validation_samples: null

# ──────────────────────────────────────────────────────────────────────────────
# Finetune Configuration
# ──────────────────────────────────────────────────────────────────────────────
finetune:
  enabled: false             # Set true to enable finetuning
  source: "local"            # Options: "local" or "huggingface"

  # HuggingFace configuration (used when source="huggingface")
  huggingface:
    repo_id: "username/model-repo"
    filename: "best.pt"
    revision: "main"
    cache_dir: null

  # Local configuration (used when source="local")
  local:
    checkpoint_path: "./output/previous-dataset/models/best.pt"

  # Finetuning options
  learning_rate_scale: 0.1   # Multiply LR by this (0.1 = 10x lower)
  freeze_backbone: false     # Freeze backbone layers (not yet implemented)

# ──────────────────────────────────────────────────────────────────────────────
# Model Configuration
# ──────────────────────────────────────────────────────────────────────────────
model:
  checkpoint_path: null      # Specific checkpoint for inference (null = auto-detect)
  auto_checkpoint: true      # Auto-find best checkpoint

# ──────────────────────────────────────────────────────────────────────────────
# Training Configuration
# ──────────────────────────────────────────────────────────────────────────────
training:
  image_size:
    width: 192
    height: 256
  batch_size: 16
  max_epochs: 1
  learning_rate: 0.0005
  num_workers: 8
  warmup_steps: 500
  cosine_annealing: true

# ──────────────────────────────────────────────────────────────────────────────
# Output Paths (Dataset-specific structure)
# ──────────────────────────────────────────────────────────────────────────────
paths:
  # Output root directory
  output_root: "./output"

  # Dataset-specific paths are automatically constructed as:
  #   Data:   {output_root}/{dataset.name}/data/
  #   Models: {output_root}/{dataset.name}/models/
  #
  # Example with dataset.name = "mcity-coco-person-2017":
  #   Data:   ./output/mcity-coco-person-2017/data/
  #   Models: ./output/mcity-coco-person-2017/models/

  # Validation results subdirectory (relative to models directory)
  validation_dir: "validation_results"

# ──────────────────────────────────────────────────────────────────────────────
# Validation Configuration
# ──────────────────────────────────────────────────────────────────────────────
validation:
  run_after_training: true
  generate_plots: true
  save_report: true
  oks_thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]

# ──────────────────────────────────────────────────────────────────────────────
# Advanced Configuration
# ──────────────────────────────────────────────────────────────────────────────
advanced:
  seed: 42
  device: "cuda:0"
  distributed: false
  use_amp: true
  save_interval: 5
  max_keep_checkpoints: 3

# ══════════════════════════════════════════════════════════════════════════════
# QUICK START EXAMPLES
# ══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# Example 1: Train from Scratch
# ─────────────────────────────────────────────────────────────────────────────
# job:
#   type: "train"
# finetune:
#   enabled: false
#
# Result: Trains new model, saves to ./output/{dataset-name}/models/best.pt

# ─────────────────────────────────────────────────────────────────────────────
# Example 2: Finetune from Local Checkpoint
# ─────────────────────────────────────────────────────────────────────────────
# job:
#   type: "train"
# finetune:
#   enabled: true
#   source: "local"
#   local:
#     checkpoint_path: "./output/previous-dataset/models/best.pt"
#   learning_rate_scale: 0.1
#
# Result: Loads best.pt, finetunes with 10x lower LR

# ─────────────────────────────────────────────────────────────────────────────
# Example 3: Finetune from HuggingFace
# ─────────────────────────────────────────────────────────────────────────────
# job:
#   type: "train"
# finetune:
#   enabled: true
#   source: "huggingface"
#   huggingface:
#     repo_id: "username/pretrained-pose-model"
#     filename: "best.pt"
#
# Result: Downloads from HF, finetunes, saves to ./output/{dataset-name}/models/

# ─────────────────────────────────────────────────────────────────────────────
# Example 4: Inference Only
# ─────────────────────────────────────────────────────────────────────────────
# job:
#   type: "inference"
# model:
#   auto_checkpoint: true
#
# Result: Finds best.pt, runs validation, generates metrics

# ─────────────────────────────────────────────────────────────────────────────
# Example 5: Full Pipeline (Train + Validate)
# ─────────────────────────────────────────────────────────────────────────────
# job:
#   type: "both"
# finetune:
#   enabled: false
#
# Result: Trains model, then runs validation, generates all reports